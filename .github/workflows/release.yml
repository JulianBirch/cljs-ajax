name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify tag matches project version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a SemVer release tag" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(clojure -T:build print-version)"
          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag version $tag_version does not match build.clj version $project_version" >&2
            exit 1
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Run JVM tests
        run: clojure -X:test

      - name: Run ClojureScript node tests
        run: npm run test:cljs:node

      - name: Run ClojureScript browser tests
        run: npm run test:cljs:browser

      - name: Run integration tests
        run: npm run test:integration

      - name: Build jar
        run: clojure -T:build jar

      - name: Deploy to Clojars
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -T:build:deploy deploy
